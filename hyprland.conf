$activeBorderColor = rgb(739fd2) rgb(fa40a9) 45deg
$inactiveBorderColor = rgba(46688599)
general {
  col.active_border = $activeBorderColor
  col.inactive_border = $inactiveBorderColor
  border_size = 2
  gaps_in = 5
  gaps_out = 11
}
decoration {
  rounding = 8
  blur {
    enabled = true
    size = 5
    passes = 2
  }
  shadow {
    enabled = true
    range = 16
    render_power = 3
    offset = 2 5
    color = rgba(0b0e1ccc)
  }
}
